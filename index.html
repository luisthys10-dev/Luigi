<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JARVIS — AI Assistent</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #050a0f;
    --panel: rgba(10, 20, 35, 0.85);
    --border: rgba(0, 180, 255, 0.18);
    --accent: #00b4ff;
    --accent2: #0066cc;
    --text: #c8dff0;
    --text-dim: #5a7a9a;
    --danger: #ff4466;
    --success: #00ffaa;
    --orb-size: 280px;
  }

  html, body { height: 100%; overflow: hidden; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Courier New', monospace;
    font-size: 13px;
    display: flex;
    flex-direction: column;
    user-select: none;
  }

  /* ── Top bar ── */
  #topbar {
    display: flex;
    align-items: center;
    padding: 8px 20px;
    background: rgba(0,10,20,0.9);
    border-bottom: 1px solid var(--border);
    gap: 16px;
    flex-shrink: 0;
    z-index: 10;
  }
  #topbar .logo {
    font-size: 18px;
    font-weight: bold;
    color: var(--accent);
    letter-spacing: 4px;
    text-shadow: 0 0 20px var(--accent);
  }
  #topbar .time {
    margin-left: auto;
    color: var(--text-dim);
    font-size: 12px;
    letter-spacing: 1px;
  }

  /* Wake word indicator */
  #wake-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #333;
    transition: background 0.3s;
    flex-shrink: 0;
  }
  #wake-dot.active {
    background: var(--success);
    box-shadow: 0 0 8px var(--success);
    animation: pulse-dot 2s infinite;
  }
  @keyframes pulse-dot {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }
  #wake-label { font-size: 10px; color: var(--text-dim); letter-spacing: 1px; }

  /* ── Main layout ── */
  #main { display: flex; flex: 1; overflow: hidden; }

  /* ── Panels ── */
  .panel {
    width: 260px;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    background: var(--panel);
    border-right: 1px solid var(--border);
    overflow: hidden;
  }
  #right-panel { border-right: none; border-left: 1px solid var(--border); }

  .panel-header {
    padding: 10px 14px;
    border-bottom: 1px solid var(--border);
    font-size: 10px;
    letter-spacing: 2px;
    color: var(--accent);
    text-transform: uppercase;
    flex-shrink: 0;
  }
  .panel-body {
    flex: 1;
    overflow-y: auto;
    padding: 12px;
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
  }

  /* ── Center ── */
  #center {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
  }

  /* ── WebGL Canvas ── */
  #orb-canvas {
    width: var(--orb-size);
    height: var(--orb-size);
    cursor: pointer;
    border-radius: 50%;
    flex-shrink: 0;
  }

  /* ── Status ring ── */
  #status-ring {
    position: absolute;
    width: calc(var(--orb-size) + 30px);
    height: calc(var(--orb-size) + 30px);
    border-radius: 50%;
    border: 1px solid var(--border);
    pointer-events: none;
    animation: spin-slow 20s linear infinite;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
  }
  @keyframes spin-slow { to { transform: translate(-50%, -50%) rotate(360deg); } }

  /* ── Transcript area ── */
  #transcript-area {
    position: absolute;
    bottom: 80px;
    left: 50%;
    transform: translateX(-50%);
    width: 90%;
    max-width: 600px;
    text-align: center;
    pointer-events: none;
  }
  #interim-text {
    color: var(--text-dim);
    font-style: italic;
    font-size: 13px;
    min-height: 20px;
    margin-bottom: 6px;
  }
  #final-text { color: var(--text); font-size: 14px; min-height: 20px; }

  /* ── Controls ── */
  #controls {
    position: absolute;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 12px;
    align-items: center;
  }
  .ctrl-btn {
    background: rgba(0, 180, 255, 0.1);
    border: 1px solid var(--border);
    color: var(--accent);
    padding: 8px 16px;
    border-radius: 20px;
    cursor: pointer;
    font-family: inherit;
    font-size: 11px;
    letter-spacing: 1px;
    transition: all 0.2s;
  }
  .ctrl-btn:hover { background: rgba(0, 180, 255, 0.2); box-shadow: 0 0 15px rgba(0,180,255,0.3); }

  #mic-btn {
    width: 50px; height: 50px;
    border-radius: 50%;
    border: 2px solid var(--accent);
    background: transparent;
    color: var(--accent);
    font-size: 20px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.2s;
    flex-shrink: 0;
  }
  #mic-btn.listening {
    background: rgba(0,180,255,0.2);
    box-shadow: 0 0 30px rgba(0,180,255,0.6);
    animation: pulse-mic 1s infinite;
  }
  @keyframes pulse-mic {
    0%, 100% { box-shadow: 0 0 20px rgba(0,180,255,0.4); }
    50% { box-shadow: 0 0 40px rgba(0,180,255,0.8); }
  }

  #status-label {
    font-size: 10px;
    letter-spacing: 2px;
    color: var(--text-dim);
    text-transform: uppercase;
    text-align: center;
    margin-top: 8px;
  }

  /* ── Planning widget ── */
  .planning-item {
    background: rgba(0, 180, 255, 0.05);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px 10px;
    margin-bottom: 8px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .planning-item:hover { background: rgba(0, 180, 255, 0.1); }
  .planning-item.done { opacity: 0.35; text-decoration: line-through; }
  .planning-taak { font-size: 12px; color: var(--text); margin-bottom: 4px; }
  .planning-meta {
    font-size: 10px;
    color: var(--text-dim);
    display: flex;
    justify-content: space-between;
  }
  .prio-hoog { color: var(--danger); }
  .prio-normaal { color: var(--accent); }
  .prio-laag { color: var(--text-dim); }
  .planning-today { border-color: rgba(0, 255, 170, 0.4); background: rgba(0, 255, 170, 0.05); }

  #add-task-btn {
    width: 100%;
    background: transparent;
    border: 1px dashed var(--border);
    color: var(--text-dim);
    padding: 6px;
    border-radius: 4px;
    cursor: pointer;
    font-family: inherit;
    font-size: 11px;
    margin-top: 8px;
  }
  #add-task-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* ── Conversation ── */
  .msg { margin-bottom: 12px; line-height: 1.5; }
  .msg-role {
    font-size: 9px;
    letter-spacing: 2px;
    color: var(--text-dim);
    margin-bottom: 4px;
    text-transform: uppercase;
  }
  .msg-content { font-size: 12px; color: var(--text); word-wrap: break-word; white-space: pre-wrap; }
  .msg.assistant .msg-role { color: var(--accent); }
  .msg.user .msg-role { color: var(--success); }

  /* ── System info ── */
  .info-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 4px 0;
    border-bottom: 1px solid rgba(0, 180, 255, 0.07);
    font-size: 11px;
  }
  .info-label { color: var(--text-dim); }
  .info-value { color: var(--accent); }

  /* ── Screenshot overlay ── */
  #screenshot-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.8);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    animation: fadeIn 0.3s ease;
  }
  #screenshot-overlay.visible { display: flex; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  #screenshot-overlay img {
    max-width: 85vw;
    max-height: 85vh;
    border: 1px solid var(--accent);
    border-radius: 4px;
    box-shadow: 0 0 40px rgba(0,180,255,0.3);
  }

  /* ── Orb flash ── */
  @keyframes orb-flash {
    0% { filter: brightness(1); }
    50% { filter: brightness(2.5) saturate(2); }
    100% { filter: brightness(1); }
  }
  .orb-flash { animation: orb-flash 0.4s ease; }

  /* ── Scan line ── */
  #scan-line {
    position: absolute;
    left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(0,180,255,0.6), transparent);
    pointer-events: none;
    animation: scan 4s ease-in-out infinite;
  }
  @keyframes scan {
    0% { top: -5%; opacity: 0; }
    5% { opacity: 1; }
    95% { opacity: 1; }
    100% { top: 105%; opacity: 0; }
  }

  /* ── Input bar ── */
  #input-bar {
    display: flex;
    gap: 8px;
    padding: 8px 12px;
    border-top: 1px solid var(--border);
    flex-shrink: 0;
    background: rgba(0,10,20,0.95);
  }
  #text-input {
    flex: 1;
    background: rgba(0,180,255,0.05);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 6px 12px;
    border-radius: 20px;
    font-family: inherit;
    font-size: 12px;
    outline: none;
  }
  #text-input:focus { border-color: rgba(0,180,255,0.5); }
  #send-btn {
    background: rgba(0,180,255,0.15);
    border: 1px solid var(--accent);
    color: var(--accent);
    padding: 6px 14px;
    border-radius: 20px;
    cursor: pointer;
    font-family: inherit;
    font-size: 11px;
  }
  #send-btn:hover { background: rgba(0,180,255,0.3); }

  /* ── Task modal ── */
  #task-modal {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 500;
  }
  #task-modal.visible { display: flex; }
  #task-modal-inner {
    background: rgba(5,15,30,0.98);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 20px;
    width: 300px;
  }
  #task-modal h3 { color: var(--accent); margin-bottom: 14px; font-size: 12px; letter-spacing: 2px; }
  #task-modal input, #task-modal select {
    width: 100%;
    background: rgba(0,180,255,0.05);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 6px 10px;
    border-radius: 4px;
    font-family: inherit;
    font-size: 12px;
    margin-bottom: 10px;
    outline: none;
  }
  #task-modal button {
    width: 100%;
    background: rgba(0,180,255,0.2);
    border: 1px solid var(--accent);
    color: var(--accent);
    padding: 8px;
    border-radius: 4px;
    cursor: pointer;
    font-family: inherit;
    font-size: 11px;
    margin-top: 4px;
  }
  .cancel-btn { background: transparent !important; border-color: var(--border) !important; color: var(--text-dim) !important; }

  .section-title {
    font-size: 9px;
    letter-spacing: 2px;
    color: var(--text-dim);
    text-transform: uppercase;
    margin: 12px 0 6px;
  }
  .section-title:first-child { margin-top: 0; }
</style>
</head>
<body>

<!-- Top bar -->
<div id="topbar">
  <div class="logo">JARVIS</div>
  <div id="wake-dot"></div>
  <div id="wake-label">WAKE</div>
  <div class="time" id="clock"></div>
</div>

<!-- Main layout -->
<div id="main">

  <!-- Left panel -->
  <div class="panel" id="left-panel">
    <div class="panel-header">Systeem &amp; Planning</div>
    <div class="panel-body">
      <div class="section-title">Status</div>
      <div class="info-row"><span class="info-label">Model</span><span class="info-value">Claude Opus</span></div>
      <div class="info-row"><span class="info-label">Taal</span><span class="info-value">Nederlands</span></div>
      <div class="info-row"><span class="info-label">Gebruiker</span><span class="info-value">Luis</span></div>
      <div class="info-row"><span class="info-label">Modus</span><span class="info-value" id="mode-label">Wacht</span></div>
      <div class="section-title" style="margin-top:16px;">Planning</div>
      <div id="planning-list"></div>
      <button id="add-task-btn">+ Taak toevoegen</button>
    </div>
  </div>

  <!-- Center -->
  <div id="center">
    <div id="scan-line"></div>
    <div id="status-ring"></div>
    <canvas id="orb-canvas" width="280" height="280"></canvas>
    <div id="status-label">Zeg "Hey Jarvis" om te beginnen</div>
    <div id="transcript-area">
      <div id="interim-text"></div>
      <div id="final-text"></div>
    </div>
    <div id="controls">
      <button class="ctrl-btn" id="screenshot-btn">Screenshot</button>
      <button id="mic-btn" title="Klik om te spreken">&#127908;</button>
      <button class="ctrl-btn" id="clear-btn">Wissen</button>
    </div>
  </div>

  <!-- Right panel -->
  <div class="panel" id="right-panel">
    <div class="panel-header">Gesprek</div>
    <div class="panel-body" id="conversation"></div>
    <div id="input-bar">
      <input type="text" id="text-input" placeholder="Typ een bericht..." autocomplete="off">
      <button id="send-btn">Stuur</button>
    </div>
  </div>

</div>

<!-- Screenshot overlay -->
<div id="screenshot-overlay">
  <img id="screenshot-img" src="" alt="Screenshot">
</div>

<!-- Task modal -->
<div id="task-modal">
  <div id="task-modal-inner">
    <h3>Nieuwe Taak</h3>
    <input type="text" id="modal-taak" placeholder="Taak omschrijving">
    <input type="date" id="modal-datum">
    <select id="modal-prio">
      <option value="normaal">Normaal</option>
      <option value="hoog">Hoog</option>
      <option value="laag">Laag</option>
    </select>
    <button id="modal-save">Opslaan</button>
    <button class="cancel-btn" id="modal-cancel">Annuleren</button>
  </div>
</div>

<script>
// ════════════════════════════════════════════════════════════
// Clock
// ════════════════════════════════════════════════════════════
function updateClock() {
  const now = new Date();
  document.getElementById('clock').textContent =
    now.toLocaleDateString('nl-NL', { weekday:'short', day:'numeric', month:'short' }) +
    '  ' + now.toLocaleTimeString('nl-NL', { hour:'2-digit', minute:'2-digit' });
}
updateClock();
setInterval(updateClock, 30000);

// ════════════════════════════════════════════════════════════
// WebGL Orb
// ════════════════════════════════════════════════════════════
(function initOrb() {
  const canvas = document.getElementById('orb-canvas');
  const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
  if (!gl) {
    canvas.style.background = 'radial-gradient(circle, #00b4ff 0%, #001a33 70%)';
    return;
  }

  const VS = `
    attribute vec2 a_pos;
    void main() { gl_Position = vec4(a_pos, 0.0, 1.0); }
  `;
  const FS = `
    precision mediump float;
    uniform float u_time;
    uniform vec2 u_res;
    uniform float u_energy;

    float hash(float n) { return fract(sin(n) * 43758.5453); }
    float noise(vec3 p) {
      vec3 i = floor(p); vec3 f = fract(p);
      f = f*f*(3.0-2.0*f);
      float n = i.x + i.y*57.0 + 113.0*i.z;
      return mix(
        mix(mix(hash(n),hash(n+1.0),f.x), mix(hash(n+57.0),hash(n+58.0),f.x), f.y),
        mix(mix(hash(n+113.0),hash(n+114.0),f.x), mix(hash(n+170.0),hash(n+171.0),f.x), f.y),
        f.z);
    }
    void main() {
      vec2 uv = (gl_FragCoord.xy - u_res*0.5) / min(u_res.x, u_res.y);
      float d = length(uv);
      float t = u_time * 0.6;
      float r = 0.42 + 0.04 * noise(vec3(uv * 4.0, t));
      float border = smoothstep(r + 0.01, r - 0.02, d);
      float glow = exp(-d * 3.0) * 0.5;
      float inner = noise(vec3(uv * 3.0 + t * 0.3, t * 0.5));
      float rings = sin(d * 18.0 - t * 2.0) * 0.5 + 0.5;
      vec3 coreColor = vec3(0.0, 0.55 + inner*0.3, 0.9 + inner*0.1);
      vec3 glowColor = vec3(0.0, 0.4, 0.9);
      coreColor = mix(coreColor, vec3(0.3, 0.7, 1.0), rings * 0.2 * u_energy);
      vec3 col = (coreColor * border) + (glowColor * glow);
      col += vec3(0.0, 0.1, 0.3) * border * rings * u_energy;
      float alpha = max(border, glow);
      gl_FragColor = vec4(col, alpha);
    }
  `;

  function compileShader(type, src) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    return s;
  }

  const prog = gl.createProgram();
  gl.attachShader(prog, compileShader(gl.VERTEX_SHADER, VS));
  gl.attachShader(prog, compileShader(gl.FRAGMENT_SHADER, FS));
  gl.linkProgram(prog);
  gl.useProgram(prog);

  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);

  const posLoc = gl.getAttribLocation(prog, 'a_pos');
  gl.enableVertexAttribArray(posLoc);
  gl.vertexAttribPointer(posLoc, 2, gl.FLOAT, false, 0, 0);

  const uTime   = gl.getUniformLocation(prog, 'u_time');
  const uRes    = gl.getUniformLocation(prog, 'u_res');
  const uEnergy = gl.getUniformLocation(prog, 'u_energy');

  gl.uniform2f(uRes, canvas.width, canvas.height);
  gl.enable(gl.BLEND);
  gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);

  const startTime = Date.now();
  window._orbEnergy = 0.3;

  (function renderOrb() {
    const t = (Date.now() - startTime) / 1000;
    gl.uniform1f(uTime, t);
    gl.uniform1f(uEnergy, window._orbEnergy);
    gl.clearColor(0,0,0,0);
    gl.clear(gl.COLOR_BUFFER_BIT);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    requestAnimationFrame(renderOrb);
  })();
})();

// ════════════════════════════════════════════════════════════
// Audio helpers
// ════════════════════════════════════════════════════════════
function playBeep(freq, duration) {
  try {
    const ctx = new AudioContext();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.frequency.value = freq || 880;
    osc.type = 'sine';
    gain.gain.setValueAtTime(0.3, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + (duration || 0.15));
    osc.start(ctx.currentTime);
    osc.stop(ctx.currentTime + (duration || 0.15));
  } catch(e) {}
}

// ════════════════════════════════════════════════════════════
// Speech synthesis
// ════════════════════════════════════════════════════════════
function speak(text, onEnd) {
  if (!window.speechSynthesis) { if (onEnd) onEnd(); return; }
  window.speechSynthesis.cancel();
  const utt = new SpeechSynthesisUtterance(text);
  utt.lang = 'nl-NL';
  utt.rate = 1.05;
  utt.pitch = 0.9;
  const voices = window.speechSynthesis.getVoices();
  const nl = voices.find(v => v.lang === 'nl-NL') || voices.find(v => v.lang.startsWith('nl'));
  if (nl) utt.voice = nl;
  utt.onstart = function() { window._orbEnergy = 1.0; setMode('Spreekt'); };
  utt.onend = function() { window._orbEnergy = 0.3; setMode('Luistert'); if (onEnd) onEnd(); };
  utt.onerror = function() { window._orbEnergy = 0.3; if (onEnd) onEnd(); };
  window.speechSynthesis.speak(utt);
}

function stopSpeaking() {
  if (window.speechSynthesis) window.speechSynthesis.cancel();
  window._orbEnergy = 0.3;
}

// ════════════════════════════════════════════════════════════
// State & helpers
// ════════════════════════════════════════════════════════════
var history = [];
var pendingScreenshot = null;

function setMode(label) {
  document.getElementById('mode-label').textContent = label;
}

function flashOrb() {
  var c = document.getElementById('orb-canvas');
  c.classList.remove('orb-flash');
  void c.offsetWidth;
  c.classList.add('orb-flash');
  setTimeout(function() { c.classList.remove('orb-flash'); }, 500);
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function addMessage(role, content) {
  history.push({ role: role, content: content });
  var conv = document.getElementById('conversation');
  var div = document.createElement('div');
  div.className = 'msg ' + role;
  div.innerHTML = '<div class="msg-role">' + (role === 'user' ? 'Luis' : 'Jarvis') + '</div>' +
                  '<div class="msg-content">' + escHtml(content) + '</div>';
  conv.appendChild(div);
  conv.scrollTop = conv.scrollHeight;
}

// ════════════════════════════════════════════════════════════
// API
// ════════════════════════════════════════════════════════════
function sendToJarvis(userText) {
  addMessage('user', userText);
  setMode('Denkt');
  window._orbEnergy = 0.6;

  var body = {
    messages: history.map(function(m) { return { role: m.role, content: m.content }; })
  };
  if (pendingScreenshot) {
    body.screenshotBase64 = pendingScreenshot;
    pendingScreenshot = null;
  }

  fetch('/api/chat', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  })
  .then(function(r) { return r.json(); })
  .then(function(data) {
    if (data.error) throw new Error(data.error);
    var text = data.response || '';
    addMessage('assistant', text);
    if (data.planning) refreshPlanning(data.planning);
    if (data.base64) showScreenshot(data.base64);
    window._orbEnergy = 0.3;
    speak(cleanForSpeech(text), function() {
      setMode('Luistert');
      restartWakeWord();
    });
  })
  .catch(function(e) {
    var msg = 'Fout: ' + e.message;
    addMessage('assistant', msg);
    window._orbEnergy = 0.3;
    speak(msg);
    setMode('Fout');
  });
}

function cleanForSpeech(text) {
  return text.replace(/^(MAKE_WORD|MAKE_EXCEL|MAKE_PPT|OPEN_FILE|TAKE_SCREENSHOT|PLANNING_ADD|PLANNING_DONE)[^\n]*/gm, '').trim();
}

// ════════════════════════════════════════════════════════════
// Planning
// ════════════════════════════════════════════════════════════
var planningData = [];

function fetchPlanning() {
  return fetch('/api/planning')
    .then(function(r) { return r.json(); })
    .then(function(data) { planningData = data; renderPlanning(data); return data; })
    .catch(function() { return []; });
}

function refreshPlanning(data) {
  planningData = data;
  renderPlanning(data);
}

function renderPlanning(tasks) {
  var list = document.getElementById('planning-list');
  list.innerHTML = '';
  var pending = tasks.filter(function(t) { return !t.gedaan; }).slice(0, 5);
  if (!pending.length) {
    list.innerHTML = '<div style="color:var(--text-dim);font-size:11px;">Geen openstaande taken</div>';
    return;
  }
  var today = new Date().toISOString().slice(0, 10);
  pending.forEach(function(t) {
    var div = document.createElement('div');
    var isToday = t.datum && t.datum === today;
    div.className = 'planning-item' + (t.gedaan ? ' done' : '') + (isToday ? ' planning-today' : '');
    var prioClass = t.prioriteit === 'hoog' ? 'prio-hoog' : t.prioriteit === 'laag' ? 'prio-laag' : 'prio-normaal';
    div.innerHTML =
      '<div class="planning-taak">' + escHtml(t.taak) + '</div>' +
      '<div class="planning-meta">' +
        '<span>' + escHtml(t.datum || 'Geen datum') + '</span>' +
        '<span class="' + prioClass + '">' + escHtml(t.prioriteit || 'normaal') + '</span>' +
      '</div>';
    div.addEventListener('click', function() { markTaskDone(t.id); });
    list.appendChild(div);
  });
}

function markTaskDone(id) {
  fetch('/api/planning/' + id, { method: 'PUT', headers: { 'Content-Type': 'application/json' } })
    .then(function() { fetchPlanning(); })
    .catch(function() {});
}

document.getElementById('add-task-btn').addEventListener('click', function() {
  document.getElementById('task-modal').classList.add('visible');
});
document.getElementById('modal-cancel').addEventListener('click', function() {
  document.getElementById('task-modal').classList.remove('visible');
});
document.getElementById('modal-save').addEventListener('click', function() {
  var taak = document.getElementById('modal-taak').value.trim();
  var datum = document.getElementById('modal-datum').value;
  var prioriteit = document.getElementById('modal-prio').value;
  if (!taak) return;
  fetch('/api/planning', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ taak: taak, datum: datum, prioriteit: prioriteit })
  })
  .then(function() {
    fetchPlanning();
    document.getElementById('task-modal').classList.remove('visible');
    document.getElementById('modal-taak').value = '';
    document.getElementById('modal-datum').value = '';
  })
  .catch(function() {});
});

setInterval(fetchPlanning, 30000);

// ════════════════════════════════════════════════════════════
// Screenshot overlay
// ════════════════════════════════════════════════════════════
function showScreenshot(base64) {
  document.getElementById('screenshot-img').src = 'data:image/png;base64,' + base64;
  document.getElementById('screenshot-overlay').classList.add('visible');
  setTimeout(function() { document.getElementById('screenshot-overlay').classList.remove('visible'); }, 4000);
}

document.getElementById('screenshot-overlay').addEventListener('click', function() {
  document.getElementById('screenshot-overlay').classList.remove('visible');
});

document.getElementById('screenshot-btn').addEventListener('click', function() {
  setMode('Screenshot');
  fetch('/api/screenshot', { method: 'POST' })
    .then(function(r) { return r.json(); })
    .then(function(data) {
      if (data.base64) {
        showScreenshot(data.base64);
        pendingScreenshot = data.base64;
        sendToJarvis('TAKE_SCREENSHOT: Analyseer dit screenshot en beschrijf wat je ziet.');
      }
    })
    .catch(function(e) { speak('Fout bij maken screenshot.'); });
});

// ════════════════════════════════════════════════════════════
// Wake word detection
// ════════════════════════════════════════════════════════════
var wakeRecognition = null;
var mainRecognition = null;
var isListeningMain = false;
var wakeActive = false;
var silenceTimer = null;
var WAKE_WORDS = ['hey jarvis', 'jarvis open', 'jarvis'];

function initWakeWord() {
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) return;

  wakeRecognition = new SR();
  wakeRecognition.continuous = true;
  wakeRecognition.interimResults = true;
  wakeRecognition.lang = 'nl-NL';

  wakeRecognition.onresult = function(evt) {
    for (var i = evt.resultIndex; i < evt.results.length; i++) {
      var transcript = evt.results[i][0].transcript.toLowerCase().trim();
      var detected = WAKE_WORDS.some(function(w) { return transcript.includes(w); });
      if (detected && !isListeningMain) { onWakeDetected(); return; }
    }
  };

  wakeRecognition.onend = function() {
    if (wakeActive && !isListeningMain) {
      setTimeout(function() { try { wakeRecognition.start(); } catch(e) {} }, 300);
    }
  };

  wakeRecognition.onerror = function(e) {
    if (e.error !== 'no-speech' && e.error !== 'aborted') {
      setTimeout(function() { try { wakeRecognition.start(); } catch(e2) {} }, 1000);
    }
  };

  startWakeWord();
}

function startWakeWord() {
  wakeActive = true;
  document.getElementById('wake-dot').classList.add('active');
  try { wakeRecognition.start(); } catch(e) {}
}

function stopWakeWord() {
  try { if (wakeRecognition) wakeRecognition.stop(); } catch(e) {}
}

function restartWakeWord() {
  if (!wakeActive || isListeningMain || !wakeRecognition) return;
  setTimeout(function() { try { wakeRecognition.start(); } catch(e) {} }, 500);
}

function onWakeDetected() {
  stopSpeaking();
  flashOrb();
  playBeep(1200, 0.1);
  setTimeout(function() { playBeep(1600, 0.08); }, 120);
  stopWakeWord();
  setTimeout(startMainRecognition, 300);
}

// ════════════════════════════════════════════════════════════
// Main speech recognition
// ════════════════════════════════════════════════════════════
function startMainRecognition() {
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR || isListeningMain) return;

  isListeningMain = true;
  setMode('Luistert');
  window._orbEnergy = 0.7;
  document.getElementById('mic-btn').classList.add('listening');

  mainRecognition = new SR();
  mainRecognition.continuous = true;
  mainRecognition.interimResults = true;
  mainRecognition.lang = 'nl-NL';

  var finalTranscript = '';

  mainRecognition.onresult = function(evt) {
    var interim = '';
    finalTranscript = '';
    for (var i = 0; i < evt.results.length; i++) {
      if (evt.results[i].isFinal) {
        finalTranscript += evt.results[i][0].transcript;
      } else {
        interim += evt.results[i][0].transcript;
      }
    }
    document.getElementById('interim-text').textContent = interim;
    document.getElementById('final-text').textContent = finalTranscript;

    clearTimeout(silenceTimer);
    if (finalTranscript || interim) {
      silenceTimer = setTimeout(function() {
        var text = (finalTranscript || interim).trim();
        if (text) stopMainAndSend(text);
      }, 1500);
    }
  };

  mainRecognition.onerror = function(e) {
    if (e.error !== 'no-speech' && e.error !== 'aborted') stopMain();
  };

  mainRecognition.onend = function() {
    if (isListeningMain) {
      var ft = finalTranscript.trim();
      if (ft) stopMainAndSend(ft);
      else stopMain();
    }
  };

  try { mainRecognition.start(); } catch(e) { stopMain(); }
}

function stopMain() {
  isListeningMain = false;
  clearTimeout(silenceTimer);
  window._orbEnergy = 0.3;
  document.getElementById('mic-btn').classList.remove('listening');
  document.getElementById('interim-text').textContent = '';
  setMode('Wacht');
  try { if (mainRecognition) mainRecognition.stop(); } catch(e) {}
  restartWakeWord();
}

function stopMainAndSend(text) {
  clearTimeout(silenceTimer);
  isListeningMain = false;
  document.getElementById('mic-btn').classList.remove('listening');
  document.getElementById('interim-text').textContent = '';
  document.getElementById('final-text').textContent = '';
  try { if (mainRecognition) mainRecognition.stop(); } catch(e) {}
  sendToJarvis(text);
}

// ════════════════════════════════════════════════════════════
// Manual mic button
// ════════════════════════════════════════════════════════════
document.getElementById('mic-btn').addEventListener('click', function() {
  if (isListeningMain) {
    stopMain();
  } else {
    stopSpeaking();
    stopWakeWord();
    startMainRecognition();
  }
});

// ════════════════════════════════════════════════════════════
// Text input
// ════════════════════════════════════════════════════════════
function handleTextSend() {
  var inp = document.getElementById('text-input');
  var text = inp.value.trim();
  if (!text) return;
  inp.value = '';
  sendToJarvis(text);
}

document.getElementById('send-btn').addEventListener('click', handleTextSend);
document.getElementById('text-input').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') handleTextSend();
});

document.getElementById('clear-btn').addEventListener('click', function() {
  history.length = 0;
  document.getElementById('conversation').innerHTML = '';
  document.getElementById('interim-text').textContent = '';
  document.getElementById('final-text').textContent = '';
});

// ════════════════════════════════════════════════════════════
// Startup
// ════════════════════════════════════════════════════════════
function startup() {
  if (window.speechSynthesis) {
    window.speechSynthesis.getVoices();
    window.speechSynthesis.onvoiceschanged = function() {};
  }

  fetchPlanning().then(function(tasks) {
    setTimeout(function() {
      var today = new Date().toISOString().slice(0, 10);
      var todayTasks = tasks.filter(function(t) { return !t.gedaan && t.datum === today; });
      var allPending = tasks.filter(function(t) { return !t.gedaan; });

      var greeting = 'Goedendag Luis, JARVIS staat klaar.';
      if (todayTasks.length > 0) {
        var taskList = todayTasks.map(function(t) { return t.taak; }).join(', ');
        greeting = 'Goedendag Luis, je hebt vandaag ' + todayTasks.length + ' ' +
          (todayTasks.length === 1 ? 'taak' : 'taken') + ' gepland: ' + taskList + '.';
      } else if (allPending.length > 0) {
        greeting = 'Goedendag Luis, je hebt ' + allPending.length + ' openstaande ' +
          (allPending.length === 1 ? 'taak' : 'taken') + ' in je planning.';
      }

      addMessage('assistant', greeting);
      speak(greeting, function() {
        setMode('Luistert');
        restartWakeWord();
      });
    }, 2000);
  });

  setTimeout(initWakeWord, 500);
}

startup();
</script>
